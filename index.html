<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Registrasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>
  <div class="register-container">
    <div style="text-align: center; font-size: 24px; font-weight: bold; font-family: 'Poppins', sans-serif; color: #7b1fa2;">
      Selamat Datang 
    </div>
    
    <h2>Buat Akun Baru</h2>

    <div class="form-group">
      <label for="fullname">Nama Lengkap</label>
      <input type="text" id="fullname" name="fullname" required />
    </div>

    <div class="form-group">
      <label for="email">Email Aktif</label>
      <input type="email" id="email" name="email" required />
    </div>

    <div class="form-group">
      <label for="username">Nama Pengguna</label>
      <input type="text" id="username" name="username" required />
    </div>

    <div class="form-group">
      <label for="password">Kata Sandi</label>
      <input type="password" id="password" name="password" required />
    </div>

    <button class="register-btn">Daftar Sekarang</button>

    <div class="login-link">
      Sudah punya akun? <a href="https://adhaedieswulandari1212.github.io/apalah/">Masuk</a>
    </div>
    <div class="lupasandi">
      Lupa kata sandi? <a href="#">Lupa Kata Sandi</a>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js"></script>

  <script>
    // Konfigurasi Firebase
    const firebaseConfig = {
  apiKey: "AIzaSyBUxnG7la9iTjJhEAd84mQK1CX8k6HpBeA",
  authDomain: "storage-quran-apps.firebaseapp.com",
  databaseURL: "https://storage-quran-apps-default-rtdb.firebaseio.com/", // Ganti dengan URL Anda 
  projectId: "storage-quran-apps",
  storageBucket: "storage-quran-apps.firebasestorage.app",
  messagingSenderId: "898333825018",
  appId: "1:898333825018:web:47a43b54542dc91dd2b643"
};

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    document.querySelector('.register-btn').addEventListener('click', function() {
      const namaLengkap = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const username = document.getElementById('username').value;
      const kataSandi = document.getElementById('password').value;

      if (!namaLengkap || !email || !username || !kataSandi) {
        alert('Semua kolom harus diisi!');
        return;
      }

      // Membuat pengguna dengan Firebase Authentication
      auth.createUserWithEmailAndPassword(email, kataSandi)
        .then((userCredential) => {
          const user = userCredential.user;

          // Menyimpan data pengguna di Realtime Database
          database.ref('users/' + user.uid).set({
            namaLengkap: namaLengkap,
            email: email,
            username: username
          })
          .then(() => {
            alert('Registrasi berhasil! Silakan masuk.');
            window.location.href = 'https://hostingplace.github.io/Login-Quran-Apps/';
          })
          .catch((error) => {
            console.error('Gagal menyimpan data:', error);
            alert('Gagal menyimpan data: ' + error.message);
          });
        })
        .catch((error) => {
          console.error('Gagal registrasi:', error);
          if (error.code === 'auth/email-already-in-use') {
            alert('Email sudah terdaftar! Gunakan email lain.');
          } else if (error.code === 'auth/weak-password') {
            alert('Kata sandi terlalu lemah! Gunakan minimal 6 karakter.');
          } else {
            alert('Gagal registrasi: ' + error.message);
          }
        });
    });
  </script>
</body>
</html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

body {
  font-family: 'Poppins', sans-serif;
  background-color: #f7f2fa;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 50vh;
  padding: 20px;
}

.register-container {
  background-color: white;
  border-radius: 10px;
  padding: 30px 40px;
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
  width: 100%;
  max-width: 500px;
}

.register-container h2 {
  text-align: center;
  color: #7b1fa2;
  margin-bottom: 25px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
  color: #6a1b9a;
}

.form-group input {
  width: 100%;
  padding: 12px;
  border-radius: 15px;
  border: 2px solid #ccc;
  background-color: #f0d9f8;
  color: #333;
  transition: 0.3s ease;
}

.form-group input:focus {
  border-color: #7b1fa2;
  outline: none;
  background-color: #f8e5ff;
}

.register-btn {
  width: 100%;
  background-color: #9c27b0;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s ease;
}

.register-btn:hover {
  background-color: #7b1fa2;
}

.login-link {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}

.login-link a {
  color: #1976d2;
  text-decoration: none;
}

.login-link a:hover {
  text-decoration: underline;
}

.lupasandi {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}

.lupasandi a {
  color: #1976d2;
  text-decoration: none;
}

.lupasandi a:hover {
  text-decoration: underline;
}
</style>
